[project]
name = "numera-cha-solver"
version = "0.1.0"
authors = [
    { name = "KiaroSama", email = "Kiaro.Sama.Dev@gmail.com" }
]
description = "Local perception and owner-controlled verification laboratory"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi==0.142.2",
    "httpx==0.28.1",
    "numpy==2.5.3",
    "pillow==12.3.0",
    "pydantic==2.13.5",
    "uvicorn==0.54.0",
]

[project.scripts]
numera-cha = "numera_cha_solver.cli:main"

[project.optional-dependencies]
gpu = [
    "onnxruntime-gpu==1.30.0",
]
cpu = [
    "onnxruntime==1.30.0",
]
browser = [
    "playwright==1.63.0",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
timeout = 10
markers = ["gpu: real GPU model inference", "browser: owned headless browser", "official: opt-in official test-key integration"]

[tool.ty.environment]
python-version = "3.12"

[tool.uv]
conflicts = [[{ extra = "gpu" }, { extra = "cpu" }]]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout==2.4.0",
    "ruff==0.16.10",
    "ty==0.0.84",
]
