name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: numera-hosted-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native:
    name: Native / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows-x64
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            platform: macos-arm64
            target: aarch64-apple-darwin
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: '2'
      RUST_TEST_THREADS: '1'
      NUMERA_MAX_TEST_WORKERS: '1'
      NUMERA_TEST_GPU: '0'
      NUMERA_DEVICE: cpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Bind isolated hosted work, cache and native toolchain
        run: |
          $root=$env:GITHUB_WORKSPACE
          foreach ($path in @('.ci-cache/tmp','.ci-work/tools','.ci-work/hosted')) {
            [IO.Directory]::CreateDirectory((Join-Path $root $path))|Out-Null
          }
          foreach ($entry in @{
            TEMP='.ci-cache/tmp'; TMP='.ci-cache/tmp'; TMPDIR='.ci-cache/tmp'
          }.GetEnumerator()) {
            "$($entry.Key)=$(Join-Path $root $entry.Value)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { throw 'Approved Rust toolchain installation failed.' }
          'RUSTUP_TOOLCHAIN=1.99.0'|Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Linux system WebView build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo timeout 180 apt-get update
          sudo timeout 300 apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev patchelf webkit2gtk-driver xvfb
      - name: Install reviewed hosted CLI and browser tooling
        run: |
          Import-Module ./desktop/ci/Hosted.psm1 -Force
          Initialize-HostedLog 'hosted-tools'
          if (-not $IsWindows) {
            $owner=Join-Path $env:GITHUB_WORKSPACE '.ci-work/tools/owned-command'
            $bootstrap=[Diagnostics.ProcessStartInfo]::new();$bootstrap.FileName=(Get-HostedCommand rustc)
            foreach($argument in @('--edition=2024','desktop/ci/owned_command.rs','-o',$owner)){$bootstrap.ArgumentList.Add($argument)}
            $bootstrap.UseShellExecute=$false;$bootstrap.CreateNoWindow=$true
            $bootstrap.RedirectStandardInput=$true;$bootstrap.RedirectStandardOutput=$true;$bootstrap.RedirectStandardError=$true
            $process=[Diagnostics.Process]::new();$process.StartInfo=$bootstrap
            try {
              $null=$process.Start();$process.StandardInput.Close()
              $stdout=$process.StandardOutput.ReadToEndAsync();$stderr=$process.StandardError.ReadToEndAsync()
              if(-not $process.WaitForExit(60000)){$process.Kill($true);$null=$process.WaitForExit(5000);throw 'Native owner bootstrap compilation timed out.'}
              if($process.ExitCode -ne 0){[Console]::Error.WriteLine($stderr.GetAwaiter().GetResult());throw 'Native owner bootstrap compilation failed.'}
            } finally {$process.Dispose()}
            $env:NUMERA_CI_OWNER_BINARY=$owner
            "NUMERA_CI_OWNER_BINARY=$owner"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
          $tools=Join-Path $env:GITHUB_WORKSPACE '.ci-work/tools'
          $asset=@{
            'windows-x64'=@{name='cargo-tauri-x86_64-pc-windows-msvc.zip';hash='bef439eb1a0edd5192ed0009945e5de660b642a51519efe7d6953d70c5ab1939'}
            'linux-x64'=@{name='cargo-tauri-x86_64-unknown-linux-gnu.tgz';hash='35c7b50266256cb6d5f757608d7097a59a5faeb0c75879ee1f504652a9b6087e'}
            'macos-arm64'=@{name='cargo-tauri-aarch64-apple-darwin.zip';hash='4a27a61b06e688308a5c17333008b6df52fd5780fa7a313a9ce8fb4a80dfb9ac'}
          }['${{ matrix.platform }}']
          $archive=Join-Path $tools $asset.name
          Invoke-WebRequest -Uri "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.12.2/$($asset.name)" -OutFile $archive -ConnectionTimeoutSeconds 30 -OperationTimeoutSeconds 180
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $asset.hash) { throw 'Official Tauri CLI archive hash differs.' }
          $bin=Join-Path $tools 'bin';[IO.Directory]::CreateDirectory($bin)|Out-Null
          if ($asset.name.EndsWith('.zip')) { [IO.Compression.ZipFile]::ExtractToDirectory($archive,$bin) }
          else { Assert-Exit (Invoke-Hosted tar @('-xzf',$archive,'-C',$bin) 30 15) 'tauri-cli-extraction' }
          $tool=@(Get-ChildItem -LiteralPath $bin -File -Recurse -Filter $(if($IsWindows){'cargo-tauri.exe'}else{'cargo-tauri'}))
          if ($tool.Count -ne 1) { throw 'Official Tauri CLI executable is missing.' }
          if (-not $IsWindows) { Assert-Exit (Invoke-Hosted chmod @('755',$tool[0].FullName) 10 5) 'tauri-cli-executable-mode' }
          $tool[0].DirectoryName|Out-File $env:GITHUB_PATH -Append -Encoding utf8
          ./scripts/prepare_browser.ps1 -Platform '${{ matrix.platform }}'
      - name: Install Linux native desktop driver
        if: runner.os == 'Linux'
        run: |
          Import-Module ./desktop/ci/Hosted.psm1 -Force
          Initialize-HostedLog 'hosted-desktop-driver'
          Assert-Exit (Invoke-Hosted cargo @('install','tauri-driver','--version','=2.1.0','--locked','--root',(Join-Path $env:GITHUB_WORKSPACE '.ci-work/tools'),'--jobs','2') 300 120) 'tauri-driver-install'
      - name: Initialize approved private project signer
        env:
          NUMERA_SIGNING_PFX: ${{ secrets.NUMERA_SIGNING_PFX }}
          NUMERA_SIGNING_PASSWORD: ${{ secrets.NUMERA_SIGNING_PASSWORD }}
          NUMERA_SIGNING_KEY: ${{ secrets.NUMERA_SIGNING_KEY }}
        run: ./scripts/sign_release.ps1 -Phase Initialize
      - name: Acquire pinned official CPU runtime and immutable owned model
        run: ./scripts/prepare_runtime.ps1 -Platform '${{ matrix.platform }}'
      - name: Native contracts, desktop, browser and installed packages
        run: ./scripts/hosted_ci.ps1 -Platform '${{ matrix.platform }}' -Target '${{ matrix.target }}'
      - name: Preserve bounded sanitized stage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-${{ matrix.platform }}
          path: .ci-work/hosted/results.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload inspected native artifacts, not a release
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: numera-cha-0.4.0-${{ matrix.platform }}
          path: .ci-work/artifacts/*
          if-no-files-found: error
          retention-days: 14
      - name: Preserve exact native release validator
        if: success() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-release-validator
          path: target/debug/examples/distribution
          if-no-files-found: error
          retention-days: 14
      - name: Remove ephemeral private signer
        if: always()
        run: |
          if($IsMacOS){
            if(Test-Path .ci-work/signing/keychains.json){$previous=@([IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE '.ci-work/signing/keychains.json'),[Text.Encoding]::UTF8)|ConvertFrom-Json);security list-keychains -d user -s @previous}
            if(Test-Path .ci-work/signing/publisher.keychain-db){security delete-keychain (Join-Path $env:GITHUB_WORKSPACE '.ci-work/signing/publisher.keychain-db')}
          }
          if(Test-Path .ci-work/signing){Remove-Item -LiteralPath .ci-work/signing -Recurse -Force}
  release:
    name: Verify release assets
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: numera-cha-0.4.0-*
          path: .ci-work/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-release-validator
          path: .ci-work/release-validator
      - name: Verify exact native archives without publication
        run: ./scripts/publish_release.ps1 -Artifacts (Join-Path $env:GITHUB_WORKSPACE '.ci-work/release')
