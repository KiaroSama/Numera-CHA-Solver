name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: numera-ci
  cancel-in-progress: false
jobs:
  windows-native:
    runs-on: [self-hosted, Windows, X64, numera-cha, gpu]
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Bind existing project-owned runtime
        run: |
          $runtime = Split-Path -Parent (Split-Path -Parent (Split-Path -Parent $env:RUNNER_WORKSPACE))
          if (-not (Test-Path -LiteralPath (Join-Path $runtime 'data/models') -PathType Container)) {
            throw 'Project-owned immutable model fixture directory is unavailable.'
          }
          "NUMERA_RUNTIME_ROOT=$runtime" >> $env:GITHUB_ENV
          $configuration = Join-Path $runtime 'data/runtime-config.json'
          if (Test-Path -LiteralPath $configuration -PathType Leaf) {
            $config = Get-Content -LiteralPath $configuration -Raw -Encoding utf8 | ConvertFrom-Json
            if ($config.dll_directory -isnot [string]) { throw 'Runtime library configuration is invalid.' }
            "NUMERA_DLL_DIRECTORY=$($config.dll_directory)" >> $env:GITHUB_ENV
          }
          $temp = Join-Path $env:GITHUB_WORKSPACE '.ci-cache/tmp'
          [IO.Directory]::CreateDirectory($temp) | Out-Null
          "TEMP=$temp" >> $env:GITHUB_ENV
          "TMP=$temp" >> $env:GITHUB_ENV
      - name: Bind temporary source oracle without installing application dependencies
        run: |
          $source = Join-Path $env:NUMERA_RUNTIME_ROOT '.venv/Scripts/python.exe'
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { throw 'Pinned source-oracle runtime is unavailable.' }
          "NUMERA_ORACLE_PYTHON=$source" >> $env:GITHUB_ENV
      - name: Native parity, device, browser, package and launcher gates
        run: ./scripts/native_ci.ps1 -Gpu -Browser
      - name: Preserve bounded native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-validation
          path: .ci-work/native-ci/results.json
          if-no-files-found: warn
          retention-days: 7
