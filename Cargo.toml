[package]
name = "numera-cha-solver"
version = "0.4.2"
edition = "2024"
rust-version = "1.99"
authors = ["KiaroSama <Kiaro.Sama.Dev@gmail.com>"]
description = "Local perception and owner-controlled verification laboratory"
license-file = "LICENSE"
repository = "https://github.com/KiaroSama/Numera-CHA-Solver"

[workspace]
members = ["desktop"]
default-members = ["."]
resolver = "3"

[lib]
name = "numera_cha_solver"
path = "src/lib.rs"

[[bin]]
name = "numera-cha"
path = "src/main.rs"

[[bin]]
name = "numera-cha-solver-mcp"
path = "src/bin/numera-cha-solver-mcp.rs"

[dependencies]
rmcp = { version = "=3.7.0", default-features = false, features = ["server", "client", "macros", "schemars", "transport-io", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "reqwest"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
regex = "=1.13.1"
axum = "=0.8.9"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time", "signal", "fs", "io-std"] }
clap = { version = "=4.6.7", features = ["derive"] }
rusqlite = { version = "=0.41.1", features = ["bundled"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
sha2 = "=0.11.1"
base64 = "=0.23.1"
chrono = "=0.4.45"
rand = "=0.10.3"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "cuda", "api-27"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_Networking_WinSock"] }

[dev-dependencies]
zip = { version = "=9.1.0", default-features = false, features = ["deflate"] }
libc = "=0.2.191"
tempfile = "=3.27.0"

[profile.release]
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
